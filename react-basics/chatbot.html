<!doctype html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body {
        margin-top: 0px;
        margin-bottom: 0px;
      }
      .send-button {
        background-color: rgb(25, 135, 84);
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 15px;
        border-radius: 10px;
        cursor: pointer;
      }
      .chat-input {
        font-size: 15 px;
        padding: 12px 15px;
        border-width: 1px;
        border-radius: 10px;
        margin-right: 10px;
        flex: 1;
      }
      .chat-input-container {
        display: flex;
        margin-bottom: 20px;
      }
      .app-container {
        display: flex;
        flex-direction: column;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;
      }
      .chat-user-message {
        display: flex;
        column-gap: 10px;
        justify-content: end;
        align-items: center;
      }
      .chat-robot-message {
        display: flex;
        column-gap: 0px;
        align-items: center;
      }
      .chat-bubble {
        background-color: rgb(238, 238, 238);
        padding: 15px 20px;
        border-radius: 10px;
        max-width: 300px;
      }
      .chat-message-profile {
        width: 45px;
      }
      .chat-messages-container {
        flex-grow: 1;
        overflow: scroll;
        scrollbar-width: none;
      }
      .welcome-msg {
        text-align: center;
        color: rgba(0, 0, 0, 0.626);
      }
      .loading-spinner {
        height: 40px;
        margin: -15px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      //personalized hook
      function useAutoScroll(dependencies) {
        const ref = React.useRef(null);
        React.useEffect(() => {
          const containerElem = ref.current;
          if (containerElem) {
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        }, [dependencies]);
        return ref;
      }
      //1.Function ChatInput
      function ChatInput({ chatMessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState("");
        const [isLoading, setIsLoading] = React.useState(false);

        //1.a saveInputText
        function saveInputText(event) {
          setInputText(event.target.value);
        }

        //1.b  send soit b button wla b enter key
        async function send() {
          //if the input is empty or the robot is already loading don't do antg
          if (inputText === "" || isLoading === true) {
            return;
          }

          //else ghadi twli loading
          setIsLoading(true);

          //... spread operator
          //update the messages
          const newChatMessages = [
            ...chatMessages,
            {
              message: inputText,
              sender: "user",
              id: crypto.randomUUID(),
            },
          ];
          //to clear the input box after typing in it
          setInputText("");
          //to update the user that the response is loading
          setChatMessages([
            ...newChatMessages,
            {
              message: (
                <img
                  src="images/loading-spinner.gif"
                  className="loading-spinner"
                />
              ),
              sender: "robot",
              id: crypto.randomUUID(),
            },
          ]);
          //get the correspondant response
          const response = await Chatbot.getResponseAsync(inputText);
          //generate the message in html
          setChatMessages(
            //... spread operator
            [
              ...newChatMessages,
              {
                message: response,
                sender: "robot",
                id: crypto.randomUUID(),
              },
            ],
          );
          //nrdo isLoading false mora mayjawb robot
          setIsLoading(false);
        }
        function pressKey(event) {
          if (event.key === "Enter") {
            send();
          } else if (event.key === "Escape") {
            setInputText("");
          }
        }

        return (
          <div className="chat-input-container">
            <input
              placeholder="Send a message to chatbot"
              size="30"
              onChange={saveInputText}
              onKeyDown={pressKey}
              value={inputText}
              className="chat-input"
            />
            <button className="send-button" onClick={send}>
              Send
            </button>
          </div>
        );
      }

      //2. Function ChatMessage
      function ChatMessage({ message, sender }) {
        // const message = props.message;
        // const sender = props.sender;
        // const { message, sender } = props;

        //intead of duplicating the code we use this
        return (
          <div
            className={
              sender === "user" ? "chat-user-message" : "chat-robot-message"
            }
          >
            {sender === "robot" && (
              <img
                src="images/robot.png"
                alt="user"
                className="chat-message-profile"
              />
            )}
            <p className="chat-bubble">{message}</p>
            {sender === "user" && (
              <img
                src="images/user.png"
                alt="user"
                className="chat-message-profile"
              />
            )}
          </div>
        );
      }

      //3. Function ChatMessages
      function ChatMessages({ chatMessages }) {
        //we create a ref
        const chatMessagesRef = useAutoScroll([chatMessages]);
        return (
          <div className="chat-messages-container" ref={chatMessagesRef}>
            {chatMessages.map((element) => {
              return (
                <ChatMessage
                  message={element.message}
                  sender={element.sender}
                  key={element.id}
                />
              );
            })}
          </div>
        );
      }

      //4. Function App
      function App() {
        // const array = React.useState([
        //   { message: "hello chatbot", sender: "user", id: "id1" },
        //   { message: "Hello, how can I help you?", sender: "robot", id: "id2" },
        //   { message: "can you get me todays date?", sender: "user", id: "id3" },
        //   { message: "Today is June 29", sender: "robot", id: "id4" },
        // ]);
        //the initial state of the array
        // const chatMessages = array[0];
        //update the html
        // const setChatMessages = array[1];

        const [chatMessages, setChatMessages] = React.useState([]);

        return (
          <div className="app-container">
            {chatMessages.length === 0 && (
              <p className="welcome-msg">
                Welcome to the chatbot project! Send a message using the textbox
                bellow!
              </p>
            )}
            <ChatMessages chatMessages={chatMessages} />
            <ChatInput
              setChatMessages={setChatMessages}
              chatMessages={chatMessages}
            />
          </div>
        );
      }
      

      const container = document.querySelector(".js-container");

      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
