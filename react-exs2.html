<!doctype html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function LoginForm() {
        return (
          <>
            <p>Hello, welcome to my website</p>
            <div>
              <input type="text" placeholder="Email" />
            </div>
            <div>
              <input type="Password" placeholder="Password" />
            </div>
            <button>Login</button>
            <button>Sign Up</button>
          </>
        );
      }

      function ProductDetails(props) {
        const { productName, productPrice, discountPrice, productImg } = props;

        return (
          <>
            <div>
              <img src={productImg} alt="" width="100" />
            </div>
            <p>{productName}</p>

            {!discountPrice ? (
              <p>Price: ${productPrice}</p>
            ) : (
              <p>
                <del>Price: ${productPrice}</del>
              </p>
            )}
            {discountPrice && <p>Discount price: ${discountPrice}</p>}
            <button>Add to Cart</button>
          </>
        );
      }

      function App() {
        return (
          <>
            <LoginForm />
            <ProductDetails
              productImg="socks.png"
              productName="Cotton Socks"
              productPrice="10.90"
              discountPrice="5.45"
            />
            <ProductDetails
              productImg="tennis-balls.png"
              productName="Tennis Ball"
              productPrice="6.00"
            />
            <ProductDetails
              productImg="t-shirt.png"
              productName="Plain T-Shirt"
              productPrice="7.99"
            />
          </>
        );
      }

      const container = document.querySelector(".js-container");

      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
